[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowsentry"
version = "0.1.0"
description = "Security scanner for n8n workflow exports - 18 rules covering auth, secrets, SSRF, code injection, SQLi and config hygiene."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "FlowSentry Contributors" }]
keywords = ["n8n", "security", "scanner", "workflow", "automation", "owasp", "sast"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.scripts]
flowsentry = "flowsentry.scanner:main"

[project.urls]
Homepage = "https://github.com/vasilicasijarvis/flowsentry"
Issues = "https://github.com/vasilicasijarvis/flowsentry/issues"

[tool.setuptools.packages.find]
include = ["flowsentry*"]
